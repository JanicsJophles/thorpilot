name: Tests
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, atlas, thorpilot]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 -m unittest discover -s companion -p 'test_*.py'
      - run: npm test
      - run: npm run build:site && node tools/check-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: thorpilot-site
          path: artifacts/site
  android:
    runs-on: [self-hosted, Linux, X64, atlas, thorpilot]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use provisioned Android SDK
        id: android-sdk
        shell: bash
        run: |
          sdk=/opt/android-sdk
          if [[ -f "$sdk/platforms/android-35/android.jar" &&
                -x "$sdk/build-tools/35.0.0/aapt2" &&
                -x "$sdk/platform-tools/adb" &&
                -s "$sdk/licenses/android-sdk-license" ]]; then
            echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
            echo "$sdk/platform-tools" >> "$GITHUB_PATH"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: android-actions/setup-android@v3
        if: steps.android-sdk.outputs.ready != 'true'
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: thorpilot-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: thorpilot-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
