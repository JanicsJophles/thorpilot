name: Tests
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, atlas, thorpilot]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 -m unittest discover -s companion -p 'test_*.py'
      - run: npm test
      - run: npm run build:site && node tools/check-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: thorpilot-site
          path: artifacts/site
  android:
    runs-on: [self-hosted, Linux, X64, atlas, thorpilot]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: thorpilot-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
