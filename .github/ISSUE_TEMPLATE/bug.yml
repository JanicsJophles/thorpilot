name: Bug report
description: Something did not work as expected.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing Thorpilot. Never post API keys, passwords, pairing codes, private server addresses, or game files."
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: "Thorpilot 0.1.0 / commit hash"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and software
      description: "Model, Android version, Cocoon version (if relevant), or browser and OS."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Tap…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: "Remove credentials, personal information, server addresses, and private library details first. Include which screen was affected."
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: "I removed secrets and private information from this report and its attachments."
          required: true
